services:
  postgres:
    image: postgres:16-alpine
    container_name: culibspace_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-culibspace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume for persistent database storage across 'docker compose down' and 'docker compose up'
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-culibspace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: culibspace_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-culibspace}?schema=public
      PORT: 8080
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      FORCE_SEED: ${FORCE_SEED:-false}
    ports:
      - "8080:8080"
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx src/server.ts"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: culibspace_frontend
    restart: always
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: http://backend:8080
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  # Explicit volume name ensures data is preserved regardless of root folder name
  postgres_data:
    name: culibspace_postgres_data
