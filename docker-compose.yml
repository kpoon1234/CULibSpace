services:
  postgres:
    image: postgres:16-alpine
    container_name: culibspace_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: culibspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culibspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: culibspace_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/culibspace?schema=public
      PORT: 8080
      CLIENT_URL: ${CLIENT_URL:-https://hatchet-crisped-recycled.ngrok-free.dev}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://hatchet-crisped-recycled.ngrok-free.dev/api/auth/google/callback}
      TICKET_CHECKOUT_SUCCESS_URL: ${TICKET_CHECKOUT_SUCCESS_URL:-https://hatchet-crisped-recycled.ngrok-free.dev/tickets/success}
      TICKET_CHECKOUT_CANCEL_URL: ${TICKET_CHECKOUT_CANCEL_URL:-https://hatchet-crisped-recycled.ngrok-free.dev/visitor/ticket}
      NODE_ENV: development
    ports:
      - "8080:8080"
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx src/server.ts"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: culibspace_frontend
    restart: always
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: http://backend:8080
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
