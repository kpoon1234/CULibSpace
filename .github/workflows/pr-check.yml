name: PR Check

on:
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: culibspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d culibspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma@6 generate
        working-directory: ./apps/backend

      - name: Typecheck Backend
        run: npx tsc --noEmit
        working-directory: ./apps/backend

      - name: Test Backend
        run: npm test --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:1/invalid
          JWT_SECRET: ci-test-only-secret

      - name: Migrate Integration Test Database
        run: npx prisma migrate deploy
        working-directory: ./apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/culibspace_test

      - name: Test Backend Database Transactions
        run: npm run test:integration --workspace=apps/backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/culibspace_test

      - name: Build Frontend
        run: npm run build --workspace=apps/frontend
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
